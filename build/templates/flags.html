{#- Flags for the language switcher, keyed by language code. -#}
{%- macro flag(code) -%}
{%- if code == "de" -%}
<svg viewBox="0 0 5 3" class="w-[18px] h-3 rounded-[2px] outline outline-1 outline-paper/40" aria-hidden="true"><rect width="5" height="1" fill="#000000" /><rect y="1" width="5" height="1" fill="#DD0000" /><rect y="2" width="5" height="1" fill="#FFCE00" /></svg>
{%- elif code == "en" -%}
<svg viewBox="0 0 60 30" class="w-[18px] h-3 rounded-[2px]" aria-hidden="true"><clipPath id="uj-s"><path d="M0,0 v30 h60 v-30 z" /></clipPath><clipPath id="uj-t"><path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z" /></clipPath><g clip-path="url(#uj-s)"><path d="M0,0 v30 h60 v-30 z" fill="#012169" /><path d="M0,0 L60,30 M60,0 L0,30" stroke="#ffffff" stroke-width="6" /><path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#uj-t)" stroke="#C8102E" stroke-width="4" /><path d="M30,0 v30 M0,15 h60" stroke="#ffffff" stroke-width="10" /><path d="M30,0 v30 M0,15 h60" stroke="#C8102E" stroke-width="6" /></g></svg>
{%- elif code == "uk" -%}
<svg viewBox="0 0 3 2" class="w-[18px] h-3 rounded-[2px]" aria-hidden="true"><rect width="3" height="1" fill="#0057B7" /><rect y="1" width="3" height="1" fill="#FFD700" /></svg>
{%- endif -%}
{%- endmacro -%}
