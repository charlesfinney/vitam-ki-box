<!DOCTYPE html>
<!-- Built by build/generate.py from build/content/{{ lang }}/{{ name }}. Edit the source, then rebuild. -->
<html lang="{{ lang }}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>{{ title }}</title>
{%- if description %}
  <meta name="description" content="{{ description }}" />
{%- endif %}
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23424257'/%3E%3Ctext x='16' y='22' font-family='Arial,sans-serif' font-size='17' font-weight='700' text-anchor='middle' fill='%23ffffff'%3EV%3C/text%3E%3C/svg%3E" />
{%- for a in alternates %}
  <link rel="alternate" hreflang="{{ a.hreflang }}" href="{{ a.href }}" />
{%- endfor %}
  <!-- Share card for messaging apps (image: build/make_og.py) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Vita Concierge" />
  <meta property="og:title" content="{{ title }}" />
{%- if description %}
  <meta property="og:description" content="{{ description }}" />
{%- endif %}
  <meta property="og:url" content="{{ page_url }}" />
  <meta property="og:locale" content="{{ t.og.locale }}" />
  <meta property="og:image" content="{{ base_url }}assets/img/og-{{ lang }}.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="{{ t.og.alt }}" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="stylesheet" href="{{ root }}assets/vitam.css" />
</head>
<body class="font-sans antialiased">

{% include "top.html" %}
{%- if divider %}
  <div class="border-t border-line"></div>
{%- endif %}

  {{ main }}

{% include "footer.html" %}

  <a href="#" class="page-top" aria-label="{{ t.top }}">{{ t.top }}</a>

  <script>
    // "Nach oben": scroll by script, so it also works inside embedded previews
    document.querySelector('.page-top').addEventListener('click', function (e) {
      e.preventDefault();
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' });
    });
    // DEMO: Die Bestellung wird nicht gespeichert. Vor Livegang durch einen echten Checkout ersetzen (Button "zahlungspflichtig bestellen", AGB, Widerrufsbelehrung).
    // Order flow: one question per screen. Without JavaScript all questions stay visible in one form.
    var orderForm = document.getElementById('order-form');
    if (orderForm) (function () {
      var steps = [].slice.call(orderForm.querySelectorAll('.order-step'));
      var bar = document.getElementById('order-progress');
      var segs = [].slice.call(bar.querySelectorAll('[data-seg]'));
      var count = document.getElementById('order-count');
      var current = 0;
      [].forEach.call(orderForm.querySelectorAll('[data-navrow], [data-summary-list]'), function (el) { el.hidden = false; });
      bar.hidden = false;

      function fields(i) { return [].slice.call(steps[i].querySelectorAll('input, textarea')); }
      function valid(i) {
        var bad = fields(i).filter(function (f) { return !f.checkValidity(); })[0];
        if (bad) { bad.reportValidity(); bad.focus(); return false; }
        return true;
      }
      function summary() {
        var ram = orderForm.querySelector('input[name="ram"]:checked');
        var text = {
          ram: ram ? [].map.call(ram.nextElementSibling.children, function (el) { return el.textContent.trim(); }).join(' · ') : '',
          use: orderForm.elements.use.value.trim() || '—',
          plz: orderForm.elements.plz.value.trim(),
          name: orderForm.elements.name.value.trim(),
          phone: orderForm.elements.phone.value.trim(),
          email: orderForm.elements.email.value.trim()
        };
        [].forEach.call(orderForm.querySelectorAll('[data-sum]'), function (el) { el.textContent = text[el.getAttribute('data-sum')]; });
      }
      function show(i, focus) {
        current = i;
        steps.forEach(function (s, k) { s.hidden = k !== i; });
        segs.forEach(function (s, k) { s.classList.toggle('bg-paper', k <= i); s.classList.toggle('bg-paper/25', k > i); });
        count.textContent = (i + 1) + '/' + steps.length;
        bar.setAttribute('aria-valuenow', i + 1);
        if (steps[i].hasAttribute('data-summary')) summary();
        if (focus) steps[i].querySelector('h3').focus();
      }

      orderForm.addEventListener('click', function (e) {
        var b = e.target.closest('[data-nav]');
        if (!b) return;
        var to = b.getAttribute('data-nav');
        if (to === 'next') { if (valid(current)) show(current + 1, true); }
        else if (to === 'back') show(current - 1, true);
        else show(parseInt(to, 10), true);
      });
      orderForm.addEventListener('keydown', function (e) {
        if (e.key !== 'Enter' || e.target.tagName !== 'INPUT' || current === steps.length - 1) return;
        e.preventDefault();
        if (valid(current)) show(current + 1, true);
      });
      orderForm.addEventListener('submit', function (e) {
        e.preventDefault();
        for (var i = 0; i < steps.length; i++) {
          if (fields(i).some(function (f) { return !f.checkValidity(); })) { show(i, false); valid(i); return; }
        }
        orderForm.hidden = true;
        var thanks = document.getElementById('order-thanks');
        thanks.hidden = false;
        thanks.setAttribute('tabindex', '-1');
        thanks.focus();
      });
      show(0, false);
    })();
  </script>
</body>
</html>
